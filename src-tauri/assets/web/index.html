<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cosmos</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Cosmos</h1>
      <span class="tag" id="tunnel">…</span>
      <button class="icon" id="view" aria-label="Alternar visão">◎</button>
      <button class="icon" id="refresh" aria-label="Atualizar">↻</button>
    </header>
    <main id="app"><div class="empty">carregando…</div></main>

    <div id="sky" hidden>
      <canvas id="sky-canvas"></canvas>
      <div class="overlay" id="sky-overlay"></div>
      <div class="summary" id="sky-summary"></div>
    </div>

    <script type="module">
      import { fetchState, post, statusDot, escapeHtml } from "/assets/app.js";

      const app = document.getElementById("app");
      const tunnelTag = document.getElementById("tunnel");
      const sky = document.getElementById("sky");
      const summary = document.getElementById("sky-summary");
      const viewBtn = document.getElementById("view");
      let masterName = "geral";
      let cosmos = null;
      let last = null;
      let mode = localStorage.getItem("cosmos.view") === "sky" ? "sky" : "list";

      function runnerRow(r) {
        return `<a class="row" href="/r/${r.id}">
          ${statusDot(r.status, r.live)}
          <span class="name">${escapeHtml(r.name)}</span>
          <span class="kind">${r.kind === "shell" ? "sh" : ""}</span>
          <span style="color:var(--muted)">›</span>
        </a>`;
      }

      function render(state) {
        masterName = state.master || "geral";
        tunnelTag.textContent = state.tunnel ? "túnel ativo" : "local";
        tunnelTag.className = "tag " + (state.tunnel ? "on" : "off");

        const projects = state.projects || [];
        const master = projects.find(
          (p) => p.name.toLowerCase() === masterName.toLowerCase(),
        );
        const rest = projects.filter((p) => p !== master);
        let html = "";

        if (master) {
          const r =
            master.runners.find(
              (x) => x.name.toLowerCase() === masterName.toLowerCase(),
            ) || master.runners[0];
          if (r) {
            html += `<div class="master">
              ${statusDot(r.status, r.live)}
              <div class="who">
                <b>${escapeHtml(r.name)}</b>
                <span>agente mestre · ${master.runners.length} runner${master.runners.length === 1 ? "" : "s"}</span>
              </div>
              <a class="icon primary" href="/r/${r.id}">abrir</a>
            </div>`;
          }
          const others = master.runners.filter((x) => x !== r);
          if (others.length) {
            html += section(master, others);
          }
        }

        for (const p of rest) html += section(p, p.runners);
        if (!projects.length)
          html = `<div class="empty">nenhum projeto ainda</div>`;
        app.innerHTML = html;
      }

      function section(p, runners) {
        return `<section class="project" data-project="${p.id}">
          <div class="head"><b>${escapeHtml(p.name)}</b><span>${escapeHtml(p.folders?.[0] || "")}</span></div>
          <div class="rows">
            ${runners.map(runnerRow).join("")}
            <button class="row add" data-add="${p.id}">+ novo agente</button>
          </div>
        </section>`;
      }

      // ------------------------------------------------------------ sky

      const SUMMARY_ORDER = [
        ["awaiting_input", "esperando você"],
        ["error", "com erro"],
        ["streaming", "escrevendo"],
        ["tool_running", "em ferramenta"],
        ["running", "rodando"],
        ["idle", "parado"],
        ["offline", "desligado"],
      ];

      function paintSummary(state) {
        const counts = {};
        for (const p of state.projects || []) {
          for (const r of p.runners || []) {
            const s = r.live ? r.status || "idle" : "offline";
            counts[s] = (counts[s] || 0) + 1;
          }
        }
        const parts = SUMMARY_ORDER.filter(([k]) => counts[k]).map(
          ([k, label]) => `<span><i>${counts[k]}</i> ${label}</span>`,
        );
        summary.innerHTML = parts.join("<span>·</span>") || "<span>vazio</span>";
        summary.classList.toggle("alert", !!counts.awaiting_input);
      }

      async function ensureCosmos() {
        if (cosmos !== null) return cosmos;
        try {
          const mod = await import("/assets/cosmos.js");
          cosmos = mod.createCosmos(
            document.getElementById("sky-canvas"),
            document.getElementById("sky-overlay"),
          );
        } catch (e) {
          cosmos = false;
        }
        if (!cosmos) return false;
        cosmos.onPick((body) => {
          location.href = `/r/${body.id}`;
        });
        return cosmos;
      }

      async function applyMode() {
        const wantSky = mode === "sky";
        viewBtn.classList.toggle("on", wantSky);
        viewBtn.textContent = wantSky ? "☰" : "◎";
        if (!wantSky) {
          document.body.classList.remove("sky");
          sky.hidden = true;
          if (cosmos) cosmos.stop();
          return;
        }
        const c = await ensureCosmos();
        if (!c) {
          mode = "list";
          localStorage.setItem("cosmos.view", "list");
          viewBtn.hidden = true;
          return;
        }
        document.body.classList.add("sky");
        sky.hidden = false;
        c.resume();
        if (last) {
          c.setState(last);
          paintSummary(last);
        }
      }

      viewBtn.addEventListener("click", () => {
        mode = mode === "sky" ? "list" : "sky";
        localStorage.setItem("cosmos.view", mode);
        applyMode();
      });

      // ------------------------------------------------------------ data

      async function load() {
        try {
          const state = await fetchState();
          last = state;
          render(state);
          if (mode === "sky" && cosmos) {
            cosmos.setState(state);
            paintSummary(state);
          }
        } catch (e) {
          app.innerHTML = `<div class="empty">sem conexão com o Cosmos</div>`;
        }
      }

      app.addEventListener("click", async (e) => {
        const add = e.target.closest("[data-add]");
        if (!add) return;
        const name = prompt("Nome do agente");
        if (!name) return;
        await post(`/api/project/${add.dataset.add}/agent`, { name });
        load();
      });

      document.getElementById("refresh").addEventListener("click", load);
      load().then(applyMode);
      setInterval(load, 4000);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (cosmos) cosmos.stop();
        } else {
          if (mode === "sky" && cosmos) cosmos.resume();
          load();
        }
      });
    </script>
  </body>
</html>
